<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Lightning Meal Plans password">
  <title>Reset Password - Lightning Meal Plans</title>

  <!-- Google Fonts Non-Blocking Loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="assets/LightningMealPlansLogo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <noscript>
    <div class="container text-center" style="padding: 2rem; background-color: #fff3cd; border: 1px solid #ffc107; border-radius: 0.75rem; margin-top: 2rem;">
      <p style="color: #856404; font-weight: 500;">JavaScript is required for password reset functionality. Please enable JavaScript in your browser to continue.</p>
    </div>
  </noscript>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <img src="assets/LightningMealPlansLogo.png" alt="Lightning Meal Plans Logo">
        <span>Lightning Meal Plans</span>
      </a>

      <button class="mobile-nav-toggle" aria-label="Toggle Navigation" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#features">Features</a></li>
        <li><a href="index.html#how-it-works">How It Works</a></li>
        <li><a href="blog/index.html">Blog</a></li>
        <li><a href="index.html#faq">FAQ</a></li>
        <li><a href="support.html">Support</a></li>
      </ul>

      <div class="nav-cta">
        <a href="https://apps.apple.com/us/app/lightningmealplans-ai-planner/id6790597906" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
          Get App
        </a>
      </div>
    </div>
  </header>

  <main class="section-padding" style="background-color: var(--color-background); min-height: 70vh;">
    <div class="container container-narrow" style="max-width: 520px;">
      <div class="content-card" style="border-top: 4px solid var(--color-primary);">
        <h2 class="text-center">Reset Your Password</h2>
        <p class="text-center" style="color: var(--color-text-muted); margin-bottom: 2rem;">
          Enter your new password below
        </p>

        <form id="reset-password-form">
          <div class="form-group" style="margin-bottom: 1.25rem;">
            <label for="new-password" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">New Password</label>
            <input 
              type="password" 
              id="new-password" 
              name="new-password" 
              placeholder="Enter your new password"
              required
              autocomplete="new-password"
              aria-describedby="password-requirements"
              style="width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-md); border: 1px solid var(--color-border);"
            >
            <small id="password-requirements" style="color: var(--color-text-subtle); font-size: 0.85rem; margin-top: 0.35rem; display: block;">
              Password must be at least 8 characters long
            </small>
          </div>

          <div class="form-group" style="margin-bottom: 1.75rem;">
            <label for="confirm-password" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Confirm Password</label>
            <input 
              type="password" 
              id="confirm-password" 
              name="confirm-password" 
              placeholder="Confirm your new password"
              required
              autocomplete="new-password"
              style="width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-md); border: 1px solid var(--color-border);"
            >
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">
            Reset Password
          </button>
        </form>

        <!-- Status/Error Message Container (hidden by default) -->
        <div id="status-message" class="hidden" role="alert" aria-live="polite" style="margin-top: 1.5rem; padding: 1rem; border-radius: var(--radius-md); text-align: center;">
          <!-- Messages inserted dynamically -->
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Lightning Meal Plans. All rights reserved.</p>
        <p><a href="index.html">Back to Main Website</a></p>
      </div>
    </div>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  
  <!-- Password reset logic -->
  <script src="js/reset-password.js"></script>
</body>
</html>
