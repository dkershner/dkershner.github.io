<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lightning Meal Plans - Authentication Action Handler">
  <title>Lightning Meal Plans - Processing...</title>

  <link rel="icon" type="image/png" href="assets/LightningMealPlansLogo.png">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: 2rem;
    }
  </style>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <img src="assets/LightningMealPlansLogo.png" alt="Lightning Meal Plans Logo">
        <span>Lightning Meal Plans</span>
      </a>
    </div>
  </header>

  <main>
    <div class="loading-container">
      <div class="spinner"></div>
      <p class="loading-text" style="margin-top: 1.5rem; color: var(--color-text-muted); font-size: 1.1rem; font-family: var(--font-heading);">
        Processing your request...
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Lightning Meal Plans. All rights reserved.</p>
        <p><a href="index.html">Back to Main Website</a></p>
      </div>
    </div>
  </footer>

  <script>
    /**
     * Firebase Authentication Action Router
     * Routes to the appropriate page based on the 'mode' parameter
     */
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const mode = urlParams.get('mode');
      const oobCode = urlParams.get('oobCode');
      const apiKey = urlParams.get('apiKey');
      
      if (!mode || !oobCode || !apiKey) {
        console.error('Missing required parameters for auth action');
        window.location.href = 'index.html';
        return;
      }
      
      const queryString = window.location.search;
      
      switch (mode) {
        case 'resetPassword':
          window.location.href = 'reset-password.html' + queryString;
          break;
        case 'verifyEmail':
          window.location.href = 'verify-email.html' + queryString;
          break;
        case 'recoverEmail':
          window.location.href = 'recover-email.html' + queryString;
          break;
        default:
          console.error('Unknown auth action mode:', mode);
          window.location.href = 'index.html';
      }
    })();
  </script>
</body>
</html>
